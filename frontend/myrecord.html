<!DOCTYPE html>
<html lang="ko">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혈당히어로 - 레시피 보관함</title>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    
    <style>
        /* LOTTERIACHAB 폰트 임포트 */
        @font-face {
            font-family: 'LOTTERIACHAB';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/LOTTERIACHAB.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'YOnepickTTF-Bold';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/YOnepickTTF-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: rgb(254, 252, 218);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgb(60, 173, 143);
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            color: black;
            align-items: center;
            height: 10vh;
        }

        .logo a {
            font-family: 'YOnepickTTF-Bold', sans-serif;
            font-size: 2rem;
            color: black;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            align-items: center;
            margin: 0;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-family: 'LOTTERIACHAB', sans-serif;
            font-size: 1.5rem;
        }

        nav a:focus, nav a:active, .logo a:focus, .logo a:active {
            color: white;
        }

        .logout-icon {
            width: 30px;
            height: 30px;
        }

        main {
            display: flex;
            height: 90vh;
            padding: 20px;
            justify-content: space-between;
            align-items: flex-start; /* 하단에 정렬 */
        }

        .calendar {
            width: 48%;
            background-color: #fff;
            padding: 20px;
            margin-left: 20px;
            margin-right: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            height: calc(100% - 20px); /* 여백 제외한 전체 높이 */
        }
        
        /* 캘린더 전체 박스 크기는 유지하면서 내부의 캘린더 크기만 줄임 */
        .fc {
            transform: scale(0.9); /* 캘린더 내용 크기를 90%로 줄임 */
            transform-origin: top center; /* 상단 가운데를 기준으로 축소 */
            align-items: center;
        }

        .fc-toolbar, .fc-header-toolbar, .fc-daygrid {
            width: 100%; /* 전체 너비를 유지 */
        }

        /* 캘린더 셀의 패딩 및 높이 조정 */
        .fc-daygrid-day-frame {
            padding: 2px; /* 셀 안의 패딩을 줄여 셀 크기를 작게 만듭니다 */
            height: 77px; /* 셀 높이를 조정하여 크기를 맞춤 */
            overflow: hidden; /* 셀 안에 내용이 넘칠 경우 숨깁니다 */

        }

        /* 날짜 숫자 크기 조정 */
        .fc-daygrid-day-number {
            font-size: 0.8rem; /* 날짜 숫자 크기 줄이기 */
            padding-top: 3px; /* 날짜 숫자의 상단 여백 조정 */
        }

        /* 이벤트 텍스트 크기 조정 */
        .fc-daygrid-event {
            font-size: 0.3rem; /* 이벤트 텍스트 크기 줄이기 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 레시피 보관함 */
        .recipe-storage {
            width: 48%;
            background-color: #fff;
            padding: 20px;
            margin-right: 20px;
            margin-left: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            height: calc(100% - 20px); /* 여백 제외한 전체 높이 */
            overflow-y: auto; /* 내용이 넘칠 경우 스크롤 추가 */
            position: relative; /* 제목 위치 설정을 위해 position을 relative로 설정 */
        }

        .recipe-storage ul {
            list-style: none;
            padding: 0;
        }

        /* 레시피 보관함 제목 스타일 추가 */
        .recipe-title {
            font-family: 'LOTTERIACHAB', sans-serif;
            font-size: 4rem;
            color: rgb(60, 173, 143);
            text-align: center;
            margin-top: 20px;
        }

       /* 레시피 리스트 스타일 */
        .recipe-list-container {
            border: 2px solid rgb(60, 173, 143);
            border-radius: 10px;
            padding: 20px;
            background-color: #f9f9f9;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
        }

        .recipe-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .recipe-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f0f0f0;
            position: relative; /* 삭제 버튼 위치 설정을 위해 relative 사용 */
        }

        .recipe-checkbox {
            margin-right: 10px;
        }

        .recipe-title-text {
            flex-grow: 1; /* 레시피 제목이 가능한 공간을 차지하도록 */
            text-align: left;
        }

        .delete-button {
            display: none; /* 기본적으로 숨겨진 상태 */
            position: absolute;
            right: 10px; /* 레시피 아이템의 오른쪽 끝에 위치 */
            background-color: rgb(60, 173, 143);
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .recipe-checkbox:checked + .recipe-title-text + .delete-button {
            display: inline-block; /* 체크박스가 선택되었을 때 삭제 버튼 보이기 */
        }

        .delete-button:hover {
            background-color: rgb(50, 150, 130);
        }

        .modal {
            display: none;  /* 기본적으로 숨김 */
            position: fixed;
            z-index: 1;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;  /* 모달이 열릴 때 flex로 설정 */
            opacity: 1;
        }

        /* 모달 내용 스타일 수정 */
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 600px; /* 모달 너비를 고정 */
            max-width: 90%; /* 최대 너비를 화면의 90%로 제한 */
            max-height: 80%; /* 최대 높이를 화면의 80%로 제한 */
            overflow-y: auto; /* 내용이 넘칠 경우 스크롤 추가 */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
        }

        #close-modal {
            float: right;
            font-size: 24px;
        }

        /* 표의 크기를 모달에 맞게 조정 */
        table {
            width: 100%; /* 표를 모달 너비에 맞춤 */
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table, th, td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 8px;
        }

        /* 입력 필드의 테두리 및 스타일 제거 */
        input[type="text"] {
            border: none; /* 테두리 제거 */
            outline: none; /* 선택 시 기본 강조 효과 제거 */
            background-color: transparent; /* 배경색을 투명하게 설정 */
            text-align: center; /* 텍스트를 가운데 정렬 */
            font-size: 1rem; /* 입력 필드의 폰트 크기 설정 */
        }

        /* 버튼 스타일 조정 */
        .button {
            padding: 5px 15px; /* 버튼 크기 줄이기 */
            border: none;
            background-color: rgb(60, 173, 143);
            color: white;
            font-size: 0.9rem; /* 폰트 크기 줄이기 */
            cursor: pointer;
            margin: 0 5px; /* 버튼 간의 간격을 줄임 */
        }

        /* 버튼에 호버 효과 추가 */
        .button:hover {
            background-color: rgb(50, 150, 130);
        }

        /* 버튼을 가운데에 정렬하기 위한 스타일 */
        .button-container {
            display: flex;
            justify-content: center; /* 버튼을 가운데 정렬 */
            margin-top: 10px; /* 버튼과 표 간격 추가 */
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="{% url 'home' %}">혈당히어로</a>
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'upload_page' %}">레시피 생성</a></li>
                <li><a href="{% url 'myrecord' %}">내 기록</a></li>
                <li><a href="{% url 'myprofile' %}">내 정보</a></li>
                <li><a href="{% url 'logout' %}"><img src="{% static 'logout.png' %}" alt="로그아웃 아이콘" class="logout-icon"></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="calendar">
            <!-- FullCalendar 캘린더를 표시할 div -->
            <div id="calendar"></div>
        </section>

        <section class="recipe-storage">
            <h2 class="recipe-title">레시피 보관함</h2>
            <div class="recipe-list-container">
                <ul id="recipe-list" class="recipe-list">
                <!-- 레시피 리스트 -->
                </ul>
            </div>
        </section>
    </main>

    <!-- 모달 창 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>식단</th>
                        <th>혈당</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>공복</td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>아침</td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>점심</td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>                     
                    </tr>
                    <tr>
                        <td>저녁</td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>                     
                    </tr>
                </tbody>
            </table>
            <!-- 버튼 컨테이너 추가 -->
            <div class="button-container">
                <button class="button" id="saveBtn">등록</button>
                <button class="button" id="deleteBtn">삭제</button>
            </div>
        </div>
    </div>

    <!-- 모달 창 -->
    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" style="cursor: pointer;">&times;</span>
            <h1 id="modal-title"></h1>
            <h2>재료</h2>
            <ul id="modal-ingredients"></ul>
            <h2>만드는 법</h2>
            <div id="modal-instructions"></div>
        </div>
    </div>

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var modal = document.getElementById('modal');
        var currentClickedDate = null; // 현재 클릭된 날짜를 저장
        var records = {}; // 날짜별 기록을 저장하는 객체

        // 페이지 로드 시 모달을 강제로 닫아둠
        modal.style.display = "none";

        // FullCalendar 인스턴스 생성
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ko',
            height: 'auto',
            dateClick: function(info) {
                currentClickedDate = info.dateStr; // 클릭한 날짜를 저장

                // 클릭한 날짜에 이미 기록이 있는 경우 모달에 데이터 채우기
                if (records[currentClickedDate]) {
                    document.querySelectorAll('.modal-content tbody input').forEach((input, index) => {
                        input.value = records[currentClickedDate][index] || '';
                    });
                } else {
                    // 새로운 기록의 경우 입력 필드를 비우기
                    document.querySelectorAll('.modal-content tbody input').forEach((input) => {
                        input.value = '';
                    });
                }

                // 모달 창을 띄움 (날짜 칸을 클릭할 때만)
                modal.style.display = "flex";
            },
            events: [] // 초기에는 이벤트가 없으므로 빈 배열로 설정
        });

        calendar.render();

        // 모달 닫기 기능 (모달 바깥 클릭 시 닫힘)
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        });

        // 등록 버튼 이벤트 핸들러 (저장)
        document.getElementById('saveBtn').addEventListener('click', function() {
            var inputs = document.querySelectorAll('.modal-content tbody input');
            var inputData = Array.from(inputs).map(input => input.value.trim());

            // 현재 클릭된 날짜에 입력 데이터 저장
            if (currentClickedDate) {
                // 입력 데이터가 모두 비어 있지 않은지 확인하여 기록 저장
                if (inputData.some(value => value !== '')) {
                    records[currentClickedDate] = inputData;

                    // 기존 이벤트가 있으면 삭제
                    var existingEvent = calendar.getEvents().find(event => event.startStr === currentClickedDate);
                    if (existingEvent) {
                        existingEvent.remove();
                    }

                    // 새로운 이벤트 추가
                    calendar.addEvent({
                        title: '',
                        start: currentClickedDate,
                        allDay: true
                    });

                    alert('기록이 저장되었습니다.');
                } else {
                    alert('기록이 비어있어 저장되지 않았습니다.');
                }
            }

            modal.style.display = "none";
        });

        // 삭제 버튼 이벤트 핸들러
        document.getElementById('deleteBtn').addEventListener('click', function() {
            if (currentClickedDate && records[currentClickedDate]) {
                delete records[currentClickedDate];

                // 해당 날짜의 이벤트 삭제
                var existingEvent = calendar.getEvents().find(event => event.startStr === currentClickedDate);
                if (existingEvent) {
                    existingEvent.remove();
                }

                alert('기록이 삭제되었습니다.');
            }

            modal.style.display = "none";
        });
    });

    // 레시피 보관함
    document.addEventListener('DOMContentLoaded', function () {
        const modal = document.getElementById('recipe-modal');
        const closeModalButton = document.getElementById('close-modal');

        // 초기 모달 상태 설정
        modal.style.display = 'none';

        // 레시피 제목 클릭 시 모달 열기
        function attachRecipeClickEventListeners() {
            const titles = document.querySelectorAll('.recipe-title-text');
            titles.forEach(title => {
                title.addEventListener('click', async function () {
                    const recipeId = this.dataset.id;
                    await openRecipeModal(recipeId);  // 모달 열기
                });
            });
        }

        async function openRecipeModal(recipeId) {
            try {
                const response = await fetch(`/login/recipe/${recipeId}/`);
                if (!response.ok) throw new Error('레시피를 불러올 수 없습니다.');

                const recipe = await response.json();

                const ingredients = recipe.ingredients ? recipe.ingredients.split('\n') : [];
                const instructions = recipe.instructions ? recipe.instructions.split('\n') : [];

                document.getElementById('modal-title').innerText = recipe.title;
                document.getElementById('modal-ingredients').innerHTML = ingredients
                    .map(ingredient => `<li>${ingredient}</li>`)
                    .join('');
                document.getElementById('modal-instructions').innerHTML = instructions
                    .map(step => `<p>${step}</p>`)
                    .join('');

                // 모달 열기
                modal.classList.add('show');
            } catch (error) {
                console.error('레시피 모달 오류:', error);
            }
        }

        closeModalButton.addEventListener('click', function () {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        });

        // 모달 바깥 클릭 시 닫기
        window.addEventListener('click', function (event) {
            if (event.target === modal) {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            }
        });

        // 레시피 목록 불러오기
        async function loadRecipes() {
            try {
                const response = await fetch('/login/get_user_recipes/');
                if (!response.ok) throw new Error('레시피를 불러올 수 없습니다.');

                const data = await response.json();
                const recipeList = document.getElementById('recipe-list');

                if (data.recipes.length === 0) {
                    recipeList.innerHTML = '<p>저장된 레시피가 없습니다.</p>';
                } else {
                    recipeList.innerHTML = data.recipes.map(recipe => `
                        <li class="recipe-item">
                            <input type="checkbox" class="recipe-checkbox">
                            <span class="recipe-title-text" data-id="${recipe.id}">${recipe.title}</span>
                            <button class="delete-button" data-id="${recipe.id}">삭제</button>
                        </li>
                    `).join('');

                    attachDeleteEventListeners();
                    attachRecipeClickEventListeners();
                }
            } catch (error) {
                console.error('레시피 로드 오류:', error);
            }
        }

        // 삭제 버튼 이벤트 리스너 추가
        function attachDeleteEventListeners() {
            const deleteButtons = document.querySelectorAll('.delete-button');
            deleteButtons.forEach(button => {
                button.addEventListener('click', async function () {
                    const recipeId = this.dataset.id;
                    try {
                        const response = await fetch(`/login/delete_recipe/${recipeId}/`, {
                            method: 'DELETE',
                            headers: {
                                'X-CSRFToken': getCSRFToken()  // CSRF 토큰 설정
                            }
                        });
                        if (!response.ok) throw new Error('레시피 삭제 실패');
                        this.parentElement.remove();  // 레시피 항목 제거
                    } catch (error) {
                        console.error('레시피 삭제 오류:', error);
                    }
                });
            });
        }

        function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'csrftoken') return value;
            }
            return '';
        }
    });

    //                 deleteButton.style.display = 'inline-block';
    //             } else {
    //                 deleteButton.style.display = 'none';
    //             }
    //         });
    //     });

    //     // 모든 삭제 버튼을 가져옴
    //     const deleteButtons = document.querySelectorAll('.delete-button');

    //     // 각 삭제 버튼에 이벤트 리스너 추가

    </script>
</body>
