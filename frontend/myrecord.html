<!DOCTYPE html>
<html lang="ko">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혈당히어로 - 레시피 보관함</title>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">

    <style>
    @font-face {
        font-family: 'LOTTERIACHAB';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/LOTTERIACHAB.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    /* DOSSaemmul 폰트 임포트 */
    @font-face {
        font-family: 'DOSSaemmul';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/DOSSaemmul.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'YOnepickTTF-Bold';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/YOnepickTTF-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
    }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(254, 252, 218);
            font-family: sans-serif;
        }

        header {
            background-color: rgb(60, 173, 143);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            width: 100%;
            height: 10vh;
            z-index: 100;
        }

        .logo a {
            font-family: 'YOnepickTTF-Bold';
            font-size: 2rem;
            color: black;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav a {
            font-family: 'LOTTERIACHAB';
            color: black;
            text-decoration: none;
            font-size: 1.5rem;
        }

        main {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            margin-top: 12vh;
            height: calc(100vh - 12vh);
        }

        .calendar {
            width: 48%;
            background-color: #fff;
            margin-left: 20px;
            margin-right: 20px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            overflow-y: auto;
        }

        .recipe-storage {
            width: 48%;
            background-color: #fff;
            margin-left: 20px;
            margin-right: 20px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            overflow-y: auto;
            position: relative; /* 자식 요소 위치 조정 가능 */
        }

        /* 배경 이미지를 가진 스타일 */
        .recipe-storage-bg {
            background-image: url('{% static "saved_recipe_bg.jpg" %}');
            background-size: cover; /* 요소의 크기에 맞게 이미지 조정 */
            background-position: center; /* 중앙 정렬 */
            background-repeat: no-repeat; /* 반복 없음 */
            background-attachment: fixed; /* 스크롤 시 배경 고정 */
        }

        .recipe-title {
            font-size:3rem;
            text-align: center;
            color: rgb(60, 173, 143);
        }

        .recipe-list-container {
            border-radius: 10px;
            margin: 10px;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
        }

        .recipe-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: #f0f0f0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            width: 600px;
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .button {
            padding: 5px 15px;
            border: none;
            background-color: rgb(60, 173, 143);
            color: white;
            cursor: pointer;
            margin: 0 5px;
        }

        .button:hover {
            background-color: rgb(50, 150, 130);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="{% url 'home' %}">혈당히어로</a>
    </div>
    <nav>
        <ul>
            <li><a href="{% url 'upload_page' %}">레시피 생성</a></li>
            <li><a href="{% url 'myrecord' %}">내 기록</a></li>
            <li><a href="{% url 'myprofile' %}">내 정보</a></li>
            <li><a href="{% url 'logout' %}"><img src="{% static 'logout.png' %}" alt="로그아웃" width="30"></a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="calendar">
        <div id="calendar"></div>
    </section>

    <section class="recipe-storage">
        <h2 class="recipe-title" style="font-family: 'LOTTERIACHAB';">레시피 보관함</h2>
        <div class="recipe-list-container">
            <ul id="recipe-list"></ul>
        </div>
    </section>
</main>

<div id="modal" class="modal">
    <div class="modal-content">
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>식단</th>
                    <th>혈당</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>공복</td>
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>아침</td>
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>점심</td>
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>저녁</td>
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                </tr>
            </tbody>
        </table>
        <div class="button-container">
            <button class="button" id="saveBtn">등록</button>
            <button class="button" id="closeBtn">닫기</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initializeCalendar();
        loadRecipes();
    });

    function initializeCalendar() {
        const calendarEl = document.getElementById('calendar');
        const modal = document.getElementById('modal');
        let currentClickedDate = null;

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ko',
            height: 'auto',
            dateClick: function (info) {
                currentClickedDate = info.dateStr;
                modal.style.display = 'flex';
            }
        });

        calendar.render();

        document.getElementById('saveBtn').addEventListener('click', function () {
            const record = document.querySelector('.modal-content input').value.trim();
            if (record) {
                calendar.addEvent({
                    title: record,
                    start: currentClickedDate,
                    allDay: true
                });
                modal.style.display = 'none';
            }
        });

        document.getElementById('closeBtn').addEventListener('click', function () {
            modal.style.display = 'none';
        });

        window.addEventListener('click', function (event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    }

    async function loadRecipes() {
        try {
            const response = await fetch('/login/get_user_recipes/');
            if (!response.ok) throw new Error('레시피를 불러올 수 없습니다.');

            const data = await response.json();
            const recipeList = document.getElementById('recipe-list');

            if (data.recipes.length === 0) {
                recipeList.innerHTML = '<p>저장된 레시피가 없습니다.</p>';
            } else {
                recipeList.innerHTML = data.recipes.map(recipe => `
                    <li class="recipe-item">
                        <a href="/login/recipe_detail/${recipe.id}/">${recipe.title}</a>
                        <span>${new Date(recipe.created_at).toLocaleDateString()}</span>
                    </li>
                `).join('');
            }
        } catch (error) {
            console.error('레시피 로드 오류:', error);
        }
    }
</script>

</body>
</html>
