<!DOCTYPE html>
<html lang="ko">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  /* LOTTERIACHAB 폰트 임포트 */
  @font-face {
      font-family: 'LOTTERIACHAB';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/LOTTERIACHAB.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
  }

  /* DOSSaemmul 폰트 임포트 */
  @font-face {
      font-family: 'DOSSaemmul';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/DOSSaemmul.woff') format('woff');
      font-weight: normal;
      font-style: normal;
  }

  @font-face {
      font-family: 'YOnepickTTF-Bold';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/YOnepickTTF-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: rgb(254, 252, 218); /* 배경색 */
  }

  header {
      background-color: rgb(60, 173, 143);
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      color: black;
      align-items: center;
      width: 100%;
      position: fixed;
      top: 0;
      height: 10vh;
  }

  .logo a {
      font-family: 'YOnepickTTF-Bold', sans-serif;
      font-size: 2rem;
      color: black;
      text-decoration: none;
  }

  nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      align-items: center;
      margin: 0;
  }

  nav a {
      color: black;
      text-decoration: none;
      font-family: 'LOTTERIACHAB', sans-serif;
      font-size: 1.5rem;
  }

  nav a:focus, nav a:active, .logo a:focus, .logo a:active {
      color: white;
  }

  .logout-icon {
      width: 30px;
      height: 30px;
  }

  .container {
    margin-top: 100px;
  }

  .recipe-section {
    background-color: white;
    padding: 20px;
    border-radius: 8px;
    margin-top: 20px;
    margin-bottom: 20px;
    margin-right: 120px; /* 고정 버튼과의 간격을 위해 마진 추가 */
    width: 100%; /* 너비 고정 */
    max-width: 1000px; /* 최대 너비 */
    height: auto; /* 높이는 내용에 따라 확장 */
  }
  .btn-custom {
    background-color: rgb(60, 173, 143);
    font-family: 'LOTTERIACHAB'; /* 메뉴바에 폰트 적용 */
    border: none;
    color: black;
    font-size: 1.25rem;
  }

  .btn-custom:hover {
    background-color: white;
  }

  /* 버튼 고정 */
  .fixed-buttons {
    position: fixed;
    bottom: 50px; /* 하단에서 100px 떨어진 위치 */
    right: 300px; /* 우측에서 300px 떨어진 위치 */
    z-index: 1000; /* 버튼이 다른 요소 위에 위치하게 함 */
    display: flex;
    flex-direction: column;
  }
  .fixed-buttons button {
    margin-bottom: 10px;
    width: 200px; /* 버튼 너비 키움 */
    height: 60px;
  }
  /* 전체 화면에 스크롤 */
  .scrollable-page {
    height: 100vh; /* 전체 화면의 높이 */
    overflow-y: auto; /* 전체 페이지 스크롤 */
  }
</style>
</head>
<body>

  <header>
    <div class="logo">
        <a href="{% url 'home' %}">혈당히어로</a>
    </div>
    <nav>
        <ul>
            <li><a href="{% url 'upload_page' %}">레시피 생성</a></li>
            <li><a href="{% url 'myrecord' %}">내 기록</a></li>
            <li><a href="{% url 'myprofile' %}">내 정보</a></li>
            <li>
                <a href="{% url 'logout' %}">
                  <img src="{% static 'logout.png' %}" alt="로그아웃 아이콘" class="logout-icon">
                </a>
            </li>
        </ul>
    </nav>
</header>

  <!-- 레시피 저장/다시생성 고정 버튼 -->
  <!-- 상단 고정 버튼 -->
  <div class="fixed-buttons" style="right: 300px;"> <!-- 오른쪽 여백으로 고정 버튼 위치 조정 -->
    <button class="btn btn-custom" id="recipe-save">레시피 저장</button>
    <button class="btn btn-custom" id="recipe-regen">레시피 다시 생성</button>
  </div>

  <!-- 레시피 정보 섹션 -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="recipe-section text-start">
          <div id="recipe-content">
            <h1>{{ recipe.title }}</h1>
            <img src="{{ recipe.image }}" alt="레시피 이미지" style="max-width: 100%; height: auto;">
            <h2>재료</h2>
            <ul>
              {% for ingredient in recipe.ingredients %}
                <li>{{ ingredient }}</li>
              {% endfor %}
            </ul>
            <h2>만드는 법</h2>
            {% for step in recipe.instructions %}
              <p>{{ step }}</p>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // CSRF 토큰을 가져오는 함수
  function getCSRFToken() {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
          const [name, value] = cookie.trim().split('=');
          if (name === 'csrftoken') return value;
      }
      return '';
  }

  // 로딩 애니메이션 표시
  function showLoading() {
        const loader = document.createElement('div');
        loader.id = 'loading';
        loader.style.position = 'fixed';
        loader.style.top = '50%';
        loader.style.left = '50%';
        loader.style.transform = 'translate(-50%, -50%)';
        loader.style.zIndex = '1000';
        loader.innerHTML = `<div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                            </div>`;
        document.body.appendChild(loader);
  }

  // 로딩 애니메이션 숨김
  function hideLoading() {
      const loader = document.getElementById('loading');
      if (loader) loader.remove();
  }

  // 재료를 세션에서 가져오는 함수
  async function getIngredientsFromSession() {
      try {
          const response = await fetch('/mdl/api/get_ingredients/');
          if (!response.ok) throw new Error('재료 데이터를 불러오지 못했습니다.');

          const data = await response.json();
          console.log('세션에서 불러온 재료와 칼로리:', data);
          return data;
      } catch (error) {
          console.error('재료 데이터 로드 오류:', error);
          return { ingredients: [], calorie_limit: 500 };
      }
  }

  // 페이지 로드 시 서버로부터 세션의 레시피 데이터를 가져오는 함수
  async function loadRecipeFromSession() {
      try {
          const response = await fetch('/mdl/api/get_recipe/');
          if (!response.ok) throw new Error('레시피 데이터를 불러오지 못했습니다.');

          const data = await response.json();
          console.log('세션에서 불러온 레시피:', data);

          if (data.recipe) {
              displayRecipe(data.recipe);
          } else {
              alert('레시피 데이터를 찾을 수 없습니다.');
          }
      } catch (error) {
          console.error('레시피 데이터 로드 오류:', error);
      }
  }

  // 레시피 데이터를 화면에 표시하는 함수
  function displayRecipe(recipe) {
      const recipeContent = document.getElementById('recipe-content');
      
      // 재료 목록 생성 (문자열과 객체 타입 모두 처리)
      const ingredientsHTML = recipe.ingredients.map(ingredient => {
        if (typeof ingredient === 'string') {
            return `<li>${ingredient}</li>`;
        } else if (typeof ingredient === 'object') {
            // item/name 및 quantity/amount를 우선적으로 인식
            const itemName = ingredient.item || ingredient.name || '재료 없음';
            const quantityOrAmount = ingredient.quantity || ingredient.amount || '수량 미정';
            return `<li>${itemName}: ${quantityOrAmount}</li>`;
        } else {
            return `<li>재료 없음: 수량 미정</li>`;
        }
      }).join('');

      // 만드는 법 HTML 생성 (객체와 문자열 모두 처리)
      const instructionsHTML = recipe.instructions.map((step, index) => {
          let content;

          // 객체일 경우 단계와 설명을 처리
          if (typeof step === 'object' && step !== null) {
              content = step.text || '단계 설명 없음';  // 'text' 필드 인식
          } else if (typeof step === 'string') {
              content = step;
          } else {
              content = '알 수 없는 단계';
          }

          // 숫자가 이미 포함된 경우 추가하지 않음
          if (/^\d+[\.\)]/.test(content.trim())) {
              return `<p>${content}</p>`;  // 이미 번호가 있는 경우
          } else {
              return `<p>${index + 1}. ${content}</p>`;  // 번호 추가
          }
      }).join('');

      // 콘텐츠 업데이트
      recipeContent.innerHTML = `
        <h2>${recipe.title || '레시피 제목 없음'}</h2><br>
        <h3>재료</h3>
        <ul>${ingredientsHTML}</ul>
        <h3>만드는 법</h3>
        ${instructionsHTML}
      `;
  }

  // "레시피 다시 생성" 버튼 클릭 이벤트 핸들러
  document.getElementById('recipe-regen').addEventListener('click', async function () {
      
      showLoading();  // 로딩 애니메이션 표시

      const { ingredients, calorie_limit } = await getIngredientsFromSession(); // 세션에서 재료 가져오기

      if (ingredients.length === 0) {
          alert('재료가 없습니다. 다시 입력해주세요.');
          return;
      }

      try {
          console.log('새 레시피에 사용할 재료:', ingredients);
          console.log('칼로리 제한:', calorie_limit);

          const response = await fetch('/mdl/api/recipe/', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCSRFToken(),
              },
              body: JSON.stringify({
                  calorie: calorie_limit,
                  ingredients: ingredients,
              }),
          });

          hideLoading(); // 로딩 애니메이션 숨김

          if (!response.ok) throw new Error('레시피 생성 실패');

          const newRecipeData = await response.json();
          console.log('새로운 레시피:', newRecipeData);

          if (newRecipeData.recipe) {
              displayRecipe(newRecipeData.recipe);
          } else {
              alert('새로운 레시피 데이터를 찾을 수 없습니다.');
          }
      } catch (error) {
          console.error('레시피 재생성 중 오류:', error);
          hideLoading();  // 로딩 애니메이션 숨김
          alert('레시피 재생성 중 문제가 발생했습니다. 다시 시도해주세요.');
      }
  });

  // 레시피 저장 버튼 클릭 이벤트 핸들러
  document.getElementById('recipe-save').addEventListener('click', async function () {
    const recipeContent = document.getElementById('recipe-content');
    const title = recipeContent.querySelector('h2').innerText;
    const ingredients = Array.from(recipeContent.querySelectorAll('ul li')).map(li => li.innerText);
    const instructions = Array.from(recipeContent.querySelectorAll('p')).map(p => p.innerText);

    try {
        const response = await fetch('/mdl/api/save_recipe/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken(),
            },
            body: JSON.stringify({ title, ingredients, instructions }),
        });

        if (response.ok) {
            alert('레시피가 성공적으로 저장되었습니다!');
        } else {
            alert('레시피 저장에 실패했습니다. 다시 시도해주세요.');
        }
    } catch (error) {
        console.error('레시피 저장 오류:', error);
        alert('레시피 저장 중 문제가 발생했습니다.');
    }
  });



  // 페이지 로드 시 레시피 데이터 표시
  window.onload = loadRecipeFromSession;
</script>

</body>
</html>
