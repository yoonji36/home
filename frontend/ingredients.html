<!DOCTYPE html>
<html lang="ko">
<head>
{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식재료 리스트</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    /* LOTTERIACHAB 폰트 임포트 */
    @font-face {
        font-family: 'LOTTERIACHAB';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/LOTTERIACHAB.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    /* DOSSaemmul 폰트 임포트 */
    @font-face {
        font-family: 'DOSSaemmul';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/DOSSaemmul.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'YOnepickTTF-Bold';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/YOnepickTTF-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .navbar {
        background-color: rgb(60, 173, 143); /* 메뉴바 색상 */
        font-family: 'LOTTERIACHAB'; /* 메뉴바에 폰트 적용 */
        font-size: 1.5rem;
        font-weight: 100;
        padding: 10px 20px;
        height: 10vh;
    }

    body {
        background-color: rgb(254, 252, 218);
    }

    header {
        background-color: rgb(60, 173, 143);
        display: flex;
        justify-content: space-between;
        padding: 10px 20px;
        color: black;
        align-items: center;
        width: 100%;
        position: fixed;
        top: 0;
        height: 10vh;
    }

    .logo a {
        font-family: 'YOnepickTTF-Bold', sans-serif;
        font-size: 2rem;
        color: black;
        text-decoration: none;
    }

    nav ul {
        list-style: none;
        display: flex;
        gap: 20px;
        align-items: center;
        margin: 0;
    }

    nav a {
        color: black;
        text-decoration: none;
        font-family: 'LOTTERIACHAB', sans-serif;
        font-size: 1.5rem;
    }

    nav a:focus, nav a:active, .logo a:focus, .logo a:active {
        color: white;
    }

    .logout-icon {
        width: 30px;
        height: 30px;
    }

    .container {
        display: flex;
        width: 100%;
        height: 90vh;
        gap: 20px;
        margin-top: 90px;
        padding: 20px;
        font-size: 1.5em;
    }

    .ingredient-section {
        width: 50%; /* 좌측 영역 */
    }

    .ingredient-title {
        margin-bottom: 10px;
        font-size: 3rem;
        font-weight: bold;
    }

    .ingredient-list {
        background-color: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .ingredient-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .btn-delete-inline {
        display: none;
        background-color: #f44336;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
    }

    .btn-delete-inline:hover {
        background-color: #d32f2f;
    }

    .controls {
        width: 50%; /* 우측 영역 */
        background-color: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        justify-content: center; /* 세로 중앙 정렬 */
        align-items: center; /* 가로 중앙 정렬 */
        height: 100%; /* 부모 컨테이너의 전체 높이 */
    }

    .add-section {
        width: 100%; /* 섹션이 전체 너비를 차지 */
        margin-bottom: 50px;
    }

    .add-controls {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }

    .add-controls input {
        flex: 1;
        border-radius: 8px;
        border: 1px solid #ddd;
        padding: 10px;
    }

    .btn-custom {
        background-color: rgb(60, 173, 143);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
    }

    .btn-custom:hover {
        background-color: black;
    }

    .calorie-section {
        margin-top: 20px;
        width: 100%; /* 섹션이 전체 너비를 차지 */
    }

    .calorie-section input {
        width: 100px;
        border-radius: 8px;
        text-align: center;
        margin-bottom: 50px;
        margin-top: 20px;
    }

    .makerecipe-section .recipe-btn {
        background-color: rgb(60, 173, 143);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        width: 100%;
    }

    .makerecipe-section .recipe-btn:hover {
        background-color: black;
    }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="{% url 'home' %}">혈당히어로</a>
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'upload_page' %}">레시피 생성</a></li>
                <li><a href="{% url 'myrecord' %}">내 기록</a></li>
                <li><a href="{% url 'myprofile' %}">내 정보</a></li>
                <li><a href="{% url 'logout' %}"><img src="{% static 'logout.png' %}" alt="로그아웃 아이콘" class="logout-icon"></a></li>
            </ul>
        </nav>
    </header>

<div class="container">
    <!-- 좌측 식재료 리스트 섹션 -->
    <div class="ingredient-section">
        <div class="ingredient-title">식재료 리스트</div>
        <div class="ingredient-list" id="ingredient-list">
            {% for ingredient in ingredients %}
            <div class="ingredient-item">
                <input type="checkbox" onclick="toggleDeleteButton(this)">
                <span>{{ ingredient }}</span>
                <button class="btn-delete-inline" onclick="deleteIngredient(this)">삭제</button>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- 우측 재료 추가 및 레시피 생성 섹션 -->
    <div class="controls">
        <div class="add-section">
            <p><li>원하는 재료를 추가하세요</li></p>
            <div class="add-controls">
                <input type="text" id="new-ingredient" placeholder="재료를 입력하세요">
                <button class="btn-custom" id="add-ingredient-btn">재료 추가</button>
            </div>
        </div>

        <div class="calorie-section">
            <span style="text-align: left;"><li>생성할 레시피의 최대 칼로리를 입력하세요</li></span>
            <input type="number" value="500" id="calorie-input">
        </div>

        <div class="makerecipe-section">
            <button class="recipe-btn" id="recipe-btn">레시피 생성하기</button>
        </div>

        <div id="loading" style="display:none;">
            <p>레시피를 불러오는 중입니다...</p>
        </div>

    </div>

</div>

<script>
    // CSRF 토큰을 가져오는 함수
    function getCSRFToken() {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            const [name, value] = cookie.trim().split('=');
            if (name === 'csrftoken') return value;
        }
        return '';
    }

    // 로딩 애니메이션 표시
    function showLoading() {
        const loader = document.createElement('div');
        loader.id = 'loading';
        loader.style.position = 'fixed';
        loader.style.top = '50%';
        loader.style.left = '50%';
        loader.style.transform = 'translate(-50%, -50%)';
        loader.style.zIndex = '1000';
        loader.innerHTML = `<div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                            </div>`;
        document.body.appendChild(loader);
    }

    // 로딩 애니메이션 숨김
    function hideLoading() {
        const loader = document.getElementById('loading');
        if (loader) loader.remove();
    }

    // 재료와 칼로리 제한을 서버에 저장하는 함수
    async function saveIngredientsToSession(ingredients, calorieLimit) {
        try {
            const response = await fetch('/mdl/api/save_ingredients/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken(),  // CSRF 보호
                },
                body: JSON.stringify({
                    ingredients: ingredients,
                    calorieLimit: calorieLimit
                }),
            });

            if (!response.ok) throw new Error('재료 저장 실패');
            console.log('재료와 칼로리 제한이 세션에 저장되었습니다.');
        } catch (error) {
            console.error('세션 저장 오류:', error);
        }
    }

    // 재료 추가 기능
    document.getElementById('add-ingredient-btn').addEventListener('click', function () {
        const newIngredient = document.getElementById('new-ingredient').value.trim();
        if (newIngredient) {
            const ingredientList = document.getElementById('ingredient-list');
            const newItem = document.createElement('div');
            newItem.classList.add('ingredient-item');
            newItem.innerHTML = `
                <input type="checkbox" onclick="toggleDeleteButton(this)">
                <span>${newIngredient}</span>
                <button class="btn-delete-inline" onclick="deleteIngredient(this)">삭제</button>
            `;
            ingredientList.appendChild(newItem);

            const ingredients = Array.from(document.querySelectorAll('.ingredient-item span'))
            .map(span => span.textContent);
            const calorieLimit = document.getElementById('calorie-input').value;
            
            // 세션에 재료와 칼로리 제한 저장
            saveIngredientsToSession(ingredients, calorieLimit);
        }
    });

    // 체크박스 클릭 시 삭제 버튼 표시/숨김 기능
    function toggleDeleteButton(checkbox) {
        const deleteButton = checkbox.parentElement.querySelector('.btn-delete-inline');
        deleteButton.style.display = checkbox.checked ? 'inline-block' : 'none';
    }

    // 재료 삭제 기능
    function deleteIngredient(button) {
        button.parentElement.remove();
    }

    // 버튼 클릭 시, 레시피 생성 이벤트 핸들러 
    document.getElementById('recipe-btn').addEventListener('click', async function () {
        
        showLoading();  // 로딩 애니메이션 표시

        const calorieLimit = document.getElementById('calorie-input').value;
        const ingredients = Array.from(document.querySelectorAll('.ingredient-item span'))
            .map(span => span.textContent);

        if (ingredients.length === 0) {
            alert('최소 하나 이상의 재료를 추가해주세요.');
            return;
        }

        try {
            console.log('재료:', ingredients);
            console.log('칼로리 제한:', calorieLimit);

            // 세션에 재료와 칼로리 데이터를 저장
            await fetch('/mdl/api/save_ingredients/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken(),  // CSRF 토큰 추가
                },
                body: JSON.stringify({
                    ingredients: ingredients,
                    calorie_limit: calorieLimit,
                }),
            });

            // GPT API 호출
            const response = await fetch('/mdl/api/recipe/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken(),  // CSRF 토큰 추가
                },
                body: JSON.stringify({
                    calorie: calorieLimit,
                    ingredients: ingredients,
                }),
            });

            hideLoading(); // 로딩 애니메이션 숨김

            if (!response.ok) throw new Error('레시피 생성 실패');

            const data = await response.json();
            console.log('API 응답 데이터:', data);
            
            // recipes.html로 이동하며 레시피 데이터 전달
            window.location.href = "{% url 'recipes' %}";
        } catch (error) {
            console.error('레시피 생성 중 오류:', error);
            hideLoading();  // 로딩 애니메이션 숨김
            alert('레시피 생성 중 문제가 발생했습니다. 다시 시도해주세요.');
        }
    });

</script>

</body>
</html>
