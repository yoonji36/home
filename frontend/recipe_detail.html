<!DOCTYPE html>
<html lang="ko">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ recipe.title }}</title>
    <style>

    /* LOTTERIACHAB 폰트 임포트 */
    @font-face {
        font-family: 'LOTTERIACHAB';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/LOTTERIACHAB.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    /* DOSSaemmul 폰트 임포트 */
    @font-face {
        font-family: 'DOSSaemmul';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/DOSSaemmul.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'YOnepickTTF-Bold';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/YOnepickTTF-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
    }

/* Global Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-image: url('{% static "recipe_detail.jpg" %}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    height: 100vh; /* 화면 전체 높이 고정 */
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; /* 화면 전체 스크롤 비활성화 */
    font-family: 'LOTTERIACHAB', sans-serif;
    flex-direction: column;
}

/* Header */
header {
    background-color: rgb(60, 173, 143);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    width: 100%;
    height: 10vh;
    position: fixed;
    top: 0;
    z-index: 1000;
}

    .logo a {
        font-family: 'YOnepickTTF-Bold', sans-serif;
        font-size: 2rem;
        color: black;
        text-decoration: none;
    }

    nav ul {
        list-style: none;
        display: flex;
        gap: 20px;
        align-items: center;
        margin: 0;
    }

    nav a {
        color: black;
        text-decoration: none;
        font-family: 'LOTTERIACHAB', sans-serif;
        font-size: 1.5rem;
    }

    nav a:focus, nav a:active, .logo a:focus, .logo a:active {
        color: white;
    }

    .logout-icon {
        width: 30px;
        height: 30px;
    }

/* Container */
.container {
    margin-top: calc(10vh + 20px); /* 헤더 높이 + 간격 */
    width: 90%;
    max-width: 1200px;
    height: 70vh; /* 고정된 높이 */
    overflow-y: auto; /* 내부 스크롤 활성화 */
    padding: 20px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    scrollbar-width: thin; /* Firefox에서 스크롤바 얇게 */
}

/* 귀여운 스크롤바 스타일 (웹킷 전용) */
.container::-webkit-scrollbar {
    width: 10px;
}

.container::-webkit-scrollbar-track {
    background-color: #f9f9f9;
    border-radius: 10px;
}

.container::-webkit-scrollbar-thumb {
    background-color: rgb(255, 182, 193); /* 연한 핑크 */
    border-radius: 10px;
    border: 2px solid #fff; /* 트랙과의 간격 */
}

.container::-webkit-scrollbar-thumb:hover {
    background-color: rgb(255, 105, 180); /* 진한 핑크 */
}

/* Smooth Scrolling */
.container {
    scroll-behavior: smooth; /* 부드러운 스크롤 */
}


 /* 레시피 섹션 스타일 */
.recipe-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
    font-family: 'serif';
    font-size: 1.25rem;
    padding: 30px;
}

.text-content {
    font-family: 'serif';
}

.btn-custom {
    background-color: rgb(60, 173, 143);
    border: none;
    color: black;
    font-size: 1.25rem;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s;
}

.btn-custom:hover {
    background-color: rgb(50, 150, 130);
}

</style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="{% url 'home' %}">혈당히어로</a>
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'upload_page' %}">레시피 생성</a></li>
                <li><a href="{% url 'myrecord' %}">내 기록</a></li>
                <li><a href="{% url 'myprofile' %}">내 정보</a></li>
                <li>
                    <a href="{% url 'logout' %}">
                        <img src="{% static 'logout.png' %}" alt="로그아웃 아이콘" class="logout-icon">
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    
    <main class="container">
        <div class="recipe-section">
            <h1 style="text-align: center; font-size:2rem;">{{ recipe.title }}</h1>
            <br>
            <div class="text-contents">
                <h2>재료</h2><br>
                    {% for ingredient in recipe.ingredients %}
                    {{ ingredient }}
                    {% endfor %}
                <br><br><br>
                <h2>만드는 법</h2><br>
                    {% for step in recipe.instructions %}
                        {{ step }}
                    {% endfor %}
            </div>
            <a href="{% url 'myrecord' %}" class="btn-custom">목록으로 돌아가기</a>
        </div>
    </main>

    </body>
    
</html>
